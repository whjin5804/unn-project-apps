<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · DMZ 도메인 관리 시스템</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>DMZ 도메인 관리 시스템</h1>
      <p class="subtitle">DMZ 망 도메인 관리 사이트</p>

      <form id="login-form" autocomplete="off">
        <div class="field">
          <label for="username">아이디</label>
          <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">로그인</button>
        <div class="msg" id="login-msg"></div>
      </form>

      <div class="hint">초기 계정 안내 · 아이디 <strong>admin</strong> / 비밀번호 <strong>admin</strong></div>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
